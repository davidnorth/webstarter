<!-- form-field: label + input + optional field-hint. aria-describedby links hint to input. -->
<div class="field">
  <label for="example">Label</label>
  <input id="example" name="example" type="text" required aria-describedby="example-hint">
  <small class="field-hint" id="example-hint">Hint or error message.</small>
</div>
